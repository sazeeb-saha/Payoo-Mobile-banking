<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo || Home</title>

    <!-- Favicone -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- Tailwind Css -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fontawesome kit-->
    <script
      src="https://kit.fontawesome.com/55b8bcd38f.js"
      crossorigin="anonymous"
    ></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Style -->
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-base-200 max-w-md mx-auto">
    <!-- Header section -->
    <header class="border-gray-300 border-b-1">
      <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <div class="logo flex gap-1">
          <img class="w-[60px]" src="./assets/logo.png" alt="Payoo-Logo" />
          <div class="logo-content">
            <h2 class="font-bold">$ <span id="balance">45000</span></h2>
            <p class="text-[14px] text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div>
          <a class="btn btn-soft" href="/index.html"
            ><i class="fa-solid fa-right-from-bracket"></i>Logout</a
          >
        </div>
      </section>
    </header>
    <section class="w-11/12 mx-auto space-y-4 py-8">
      <h2 class="text-3xl font-bold">
        Welcome to Pay<span class="text-primary">oo</span>
      </h2>
      <p class="text-neutral/50">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>

      <div class="buttons grid grid-cols-3 gap-4">
        <div
          onclick="showOnly('add-money')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-1.png" alt="Add Money logo" />
          <h2>Add Money</h2>
        </div>
        <div
          onclick="showOnly('cash-out')"
          class="btn flex-col h-full py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-2.png" alt="Cash Out logo" />
          <h2>Cash Out</h2>
        </div>
        <div class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="./assets/opt-3.png" alt="Transfer Money logo" />
          <h2>Transfer Money</h2>
        </div>
        <div class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="./assets/opt-4.png" alt="Get Bonus logo" />
          <h2>Get Bonus</h2>
        </div>
        <div class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="./assets/opt-5.png" alt="Pay Bill logo" />
          <h2>Pay Bill</h2>
        </div>
        <div class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="./assets/opt-6.png" alt="Transactions logo" />
          <h2>Transactions</h2>
        </div>
      </div>
    </section>

    <!-- Add Money Section -->

    <section id="add-money" class="w-11/12 mx-auto hidden">
      <h2 class="text-2xl font-bold">Add Money</h2>
      <div class="card bg-base-100 w-full rounded-xl mx-auto mt-[34px]">
        <div class="card-body">
          <label class="label text-neutral font-bold mb-3"
            >Select A Bank
          </label>
          <select
            id="bank-name"
            class="select bg-base-200 rounded-full border-0 mb-5 w-full"
          >
            <option disabled selected>Select A Bank</option>
            <option>Dutch Bangla Bank</option>
            <option>Standard Chartered Bank</option>
            <option>City Bank</option>
            <option>Islami Bank</option>
            <option>Agrani Bank</option>
            <option>Pubali Bank</option>
            <option>Sonali Bank</option>
          </select>
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold mb-3"
              >Account Number
            </label>
            <input
              id="bank-acc-number"
              type="text"
              maxlength="11"
              class="input bg-base-200 rounded-full border-0 mb-5 w-full"
              placeholder="Enter Your Account Number"
            />
            <label class="label text-neutral font-bold mb-3">Amount </label>
            <input
              id="addmoney-amount"
              type="number"
              class="input bg-base-200 rounded-full border-0 mb-5 w-full"
              placeholder="Enter Amount"
            />
            <label class="label text-neutral font-bold mb-3">Pin Number</label>
            <input
              id="addmoney-pin"
              maxlength="4"
              type="password"
              class="input bg-base-200 rounded-full border-0 mb-5 w-full"
              placeholder="Enter 4 Digit Pin"
            />
            <button id="addmoney-btn" class="btn btn-primary rounded-full mt-4">
              Add Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- Cash Out Section  -->

    <section id="cash-out" class="w-11/12 mx-auto hidden">
      <h2 class="text-2xl font-bold">Cash Out</h2>
      <div class="card bg-base-100 w-full rounded-xl mx-auto mt-[34px]">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold mb-3"
              >Agent Number
            </label>
            <input
              id="agent-number"
              type="text"
              maxlength="11"
              class="input bg-base-200 rounded-full border-0 mb-5 w-full"
              placeholder="Enter Your Number"
            />
            <label class="label text-neutral font-bold mb-3">Amount </label>
            <input
              id="cashout-amount"
              type="number"
              class="input bg-base-200 rounded-full border-0 mb-5 w-full"
              placeholder="Enter Amount"
            />
            <label class="label text-neutral font-bold mb-3">Pin Number</label>
            <input
              id="cashout-pin"
              maxlength="4"
              type="password"
              class="input bg-base-200 rounded-full border-0 mb-5 w-full"
              placeholder="Enter 4 Digit Pin"
            />
            <button id="cashout-btn" class="btn btn-primary rounded-full mt-4">
              Withdraw Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>
    <script src="./script/machine.js"></script>
    <script src="./script/addmoney.js"></script>
    <script src="./script/cashout.js"></script>
  </body>
</html>
