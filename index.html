<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo || Login</title>

    <!-- Favicone -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- Tailwind Css -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fontawesome kit-->
    <script
      src="https://kit.fontawesome.com/55b8bcd38f.js"
      crossorigin="anonymous"
    ></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Style -->
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-base-200 max-w-md mx-auto">
    <div class="pt-52">
      <!-- Logo -->
      <div class="w-[260px] mx-auto">
        <img src="./assets/Logo-full.png" alt="" />
      </div>

      <!-- Form Area -->
      <div
        class="card bg-base-100 w-full max-w-sm rounded-xl mx-auto mt-[34px]"
      >
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold mb-3"
              >Mobile Number
            </label>
            <input
              id="input-number"
              type="text"
              maxlength="11"
              class="input bg-base-200 rounded-full border-0 mb-5"
              placeholder="Enter your number"
            />
            <label class="label text-neutral font-bold mb-3">4 Digit Pin</label>
            <input
              id="input-pin"
              maxlength="4"
              type="password"
              class="input bg-base-200 rounded-full border-0 mb-5"
              placeholder="Enter 4 Digit Pin"
            />
            <button id="login-btn" class="btn btn-primary rounded-full mt-4">
              Login
            </button>
          </fieldset>
        </div>
      </div>
    </div>

    <script src="./script/script.js"></script>
  </body>
</html>
